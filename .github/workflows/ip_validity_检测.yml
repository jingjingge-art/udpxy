name: udpxy扫描
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # UTC 09:30 = 北京时间17:30
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      concurrency:
        description: 并发数
        default: '300'
        type: string
      speed_threshold:
        description: 最低速度阈值 KB/s
        default: '300'
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: 创建目录
        run: mkdir -p output

      - name: 运行扫描脚本
        env:
          concurrency: ${{ github.event.inputs.concurrency || '300' }}
          speed_threshold: ${{ github.event.inputs.speed_threshold || '300' }}
        run: python py/udpxy/udpxy.py

      - name: 检查变更
        id: check
        run: |
          git add output
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 提交推送
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git commit -m "更新udpxy扫描结果 [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: 上传工件
        uses: actions/upload-artifact@v4
        with:
          name: udpxy-output
          path: output
          retention-days: 30
