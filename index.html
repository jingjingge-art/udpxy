<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直播源分组工作台 · TXT ⇄ M3U</title>
<meta name="description" content="导入本地 txt / m3u 直播源，按 demo 词库自动分组，注入 EPG 节目单与台标，导出 M3U 或 TXT。">
<style>:root{
  --bg:#0a0d11;
  --bg-2:#0e1218;
  --panel:#12171f;
  --panel-2:#161d27;
  --line:#222c39;
  --line-soft:#1a2230;
  --txt:#e6edf4;
  --txt-2:#9aa9bb;
  --txt-3:#66748a;
  --accent:#3ddcb4;
  --accent-dim:rgba(61,220,180,.12);
  --amber:#f0b429;
  --amber-dim:rgba(240,180,41,.12);
  --rose:#f2587a;
  --rose-dim:rgba(242,88,122,.12);
  --blue:#5aa9ff;
  --r-s:6px; --r-m:10px; --r-l:14px;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1100px 520px at 88% -12%,rgba(61,220,180,.08),transparent 62%),
    radial-gradient(880px 480px at 4% 104%,rgba(90,169,255,.07),transparent 60%),
    var(--bg);
  color:var(--txt);font-family:var(--sans);font-size:13.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(61,220,180,.28)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.top{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(18,23,31,.95),rgba(10,13,17,.72));
  position:sticky;top:0;z-index:40;backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,#1b2632,#0f151d);border:1px solid #263341;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.brand .mark svg{width:17px;height:17px;color:var(--accent)}
.brand h1{margin:0;font-size:15px;letter-spacing:.3px;font-weight:650}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--txt-3);letter-spacing:.2px}
.top-stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--txt-2);
  white-space:nowrap;
}
.chip b{font-family:var(--mono);font-size:12.5px;color:var(--txt);font-weight:600}
.chip.ok b{color:var(--accent)}
.chip.warn b{color:var(--amber)}
.chip.bad b{color:var(--rose)}

.layout{
  display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;
  padding:14px 18px 26px;max-width:1560px;margin:0 auto;align-items:start;
}
@media (max-width:960px){
  .layout{grid-template-columns:1fr;padding:12px}
  .rail{position:static !important;max-height:none !important}
}

/* ---------- panels ---------- */
.panel{
  background:linear-gradient(180deg,var(--panel),var(--bg-2));
  border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:0 12px 30px -22px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.03);
}
.rail{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
.rail::-webkit-scrollbar,.stage-body::-webkit-scrollbar,.modal pre::-webkit-scrollbar{width:9px;height:9px}
.rail::-webkit-scrollbar-thumb,.stage-body::-webkit-scrollbar-thumb,.modal pre::-webkit-scrollbar-thumb{background:#243040;border-radius:9px;border:2px solid transparent;background-clip:padding-box}

.blk{padding:14px 14px 16px;border-bottom:1px solid var(--line-soft)}
.blk:last-child{border-bottom:0}
.blk h2{
  margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:1.4px;
  color:var(--txt-3);font-weight:650;display:flex;align-items:center;gap:7px;
}
.blk h2 .tag{margin-left:auto;font-size:10px;letter-spacing:.4px;color:var(--txt-3);text-transform:none}

/* dropzone */
.drop{
  border:1.5px dashed #2b3846;border-radius:var(--r-m);padding:16px 12px;text-align:center;
  cursor:pointer;transition:.16s;background:rgba(255,255,255,.012);
}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-dim)}
.drop svg{width:20px;height:20px;color:var(--txt-3);margin-bottom:6px}
.drop:hover svg,.drop.over svg{color:var(--accent)}
.drop strong{display:block;font-size:12.5px;font-weight:600;color:var(--txt)}
.drop span{display:block;font-size:11px;color:var(--txt-3);margin-top:3px}

textarea{
  width:100%;background:#0b0f15;border:1px solid var(--line);border-radius:var(--r-m);
  padding:9px 10px;color:var(--txt);resize:vertical;line-height:1.55;
  font-family:var(--mono);font-size:11.5px;min-height:84px;
}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
input[type=text],input[type=url]{
  width:100%;background:#0b0f15;border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;font-family:var(--mono);font-size:11.5px;
}
.field{margin-bottom:9px}
.field label{display:block;font-size:11px;color:var(--txt-3);margin-bottom:4px;letter-spacing:.3px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--txt);cursor:pointer;font-size:12.5px;font-weight:550;
  transition:.15s;white-space:nowrap;
}
.btn svg{width:14px;height:14px}
.btn:hover{border-color:#33455a;background:#1b2431;transform:translateY(-1px)}
.btn:active{transform:none}
.btn.primary{background:linear-gradient(180deg,#2fd8ad,#1eb894);color:#04221c;border-color:#39e3bd;font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:7px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}

/* switches */
.opt{display:flex;align-items:flex-start;gap:9px;padding:6px 0;cursor:pointer;font-size:12px;color:var(--txt-2)}
.opt input{appearance:none;width:30px;height:17px;border-radius:999px;background:#1d2634;border:1px solid #2b3746;position:relative;cursor:pointer;flex:0 0 auto;margin:1px 0 0;transition:.15s}
.opt input::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#718299;transition:.15s}
.opt input:checked{background:rgba(61,220,180,.3);border-color:var(--accent)}
.opt input:checked::after{left:15px;background:var(--accent)}
.opt span{line-height:1.4}
.opt em{display:block;font-style:normal;font-size:10.5px;color:var(--txt-3)}

/* epg status */
.status{
  display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--txt-2);
  background:#0c1118;border:1px solid var(--line-soft);border-radius:9px;padding:8px 10px;margin-top:8px;
}
.dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 auto;background:var(--txt-3)}
.dot.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.dot.off{background:var(--amber);box-shadow:0 0 0 3px var(--amber-dim)}
.dot.err{background:var(--rose)}
details.more{margin-top:10px}
details.more>summary{cursor:pointer;font-size:11.5px;color:var(--txt-3);list-style:none;display:flex;align-items:center;gap:6px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary:hover{color:var(--accent)}
details.more[open]>summary{color:var(--accent);margin-bottom:8px}

/* ---------- stage ---------- */
.stage{display:flex;flex-direction:column;overflow:hidden}
.stage-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
  flex-wrap:wrap;background:rgba(255,255,255,.012);
}
.search{
  position:relative;flex:1 1 220px;min-width:160px;
}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--txt-3)}
.search input{padding-left:30px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0b0f15}
.seg button{
  border:0;background:transparent;color:var(--txt-3);padding:7px 11px;font-size:11.5px;cursor:pointer;
  border-right:1px solid var(--line-soft);
}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-dim);color:var(--accent);font-weight:600}
.stage-body{padding:6px 8px 16px;max-height:calc(100vh - 190px);overflow:auto}

.empty{
  padding:64px 20px;text-align:center;color:var(--txt-3);
}
.empty .ico{width:44px;height:44px;margin:0 auto 12px;border-radius:12px;display:grid;place-items:center;background:#141b24;border:1px solid var(--line)}
.empty .ico svg{width:20px;height:20px;color:#4a5a70}
.empty h3{margin:0 0 6px;font-size:14px;color:var(--txt-2);font-weight:600}
.empty p{margin:0 auto;font-size:12px;max-width:420px;line-height:1.7}
.empty code{font-family:var(--mono);background:#141b24;padding:1px 5px;border-radius:4px;color:var(--amber);font-size:11.5px}

/* group block */
.grp{border:1px solid var(--line-soft);border-radius:var(--r-m);margin:7px 6px;overflow:hidden;background:rgba(255,255,255,.008)}
.grp-h{
  display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer;user-select:none;
  background:linear-gradient(90deg,rgba(255,255,255,.028),transparent);
}
.grp-h:hover{background:rgba(255,255,255,.045)}
.grp-h .caret{width:12px;height:12px;color:var(--txt-3);transition:.16s;flex:0 0 auto}
.grp.closed .caret{transform:rotate(-90deg)}
.grp-h b{font-size:12.5px;font-weight:600;letter-spacing:.2px}
.grp-h .n{font-family:var(--mono);font-size:11px;color:var(--txt-3);background:#0b0f15;border:1px solid var(--line-soft);padding:1px 6px;border-radius:999px}
.grp-h .bar{margin-left:auto;width:78px;height:4px;border-radius:99px;background:#1a2230;overflow:hidden;flex:0 0 auto}
.grp-h .bar i{display:block;height:100%;background:linear-gradient(90deg,#2fd8ad,#5aa9ff)}
.grp-body{padding:2px 0 6px}
.grp.closed .grp-body{display:none}

.row{
  display:grid;grid-template-columns:20px minmax(120px,1.5fr) minmax(0,2fr) 108px 26px;
  gap:9px;align-items:center;padding:5px 11px;font-size:12.3px;
  border-top:1px solid rgba(255,255,255,.028);
}
.row:hover{background:rgba(90,169,255,.045)}
.row .idx{font-family:var(--mono);font-size:10.5px;color:#3f4d61;text-align:right}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.row .nm .logo{width:16px;height:16px;border-radius:3px;object-fit:contain;background:#0b0f15;flex:0 0 auto}
.row .url{font-family:var(--mono);font-size:10.8px;color:var(--txt-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.row select{
  background:#0b0f15;border:1px solid var(--line);border-radius:6px;padding:3px 4px;
  font-size:11px;color:var(--txt-2);width:100%;cursor:pointer;
}
.row .act{
  border:0;background:transparent;color:#4a5a70;cursor:pointer;padding:2px;border-radius:5px;
  display:grid;place-items:center;
}
.row .act:hover{color:var(--rose);background:var(--rose-dim)}
.row .act svg{width:13px;height:13px}
.badge{font-size:9.5px;letter-spacing:.3px;padding:1px 5px;border-radius:4px;font-weight:600;flex:0 0 auto}
.badge.exact{background:var(--accent-dim);color:var(--accent)}
.badge.fuzzy{background:rgba(90,169,255,.14);color:var(--blue)}
.badge.partial{background:var(--amber-dim);color:var(--amber)}
.badge.none{background:var(--rose-dim);color:var(--rose)}

@media (max-width:720px){
  .row{grid-template-columns:18px minmax(0,1fr) 96px 24px;gap:7px}
  .row .url{display:none}
}

/* ---------- modal ---------- */
.modal{
  position:fixed;inset:0;background:rgba(4,6,9,.72);backdrop-filter:blur(4px);
  display:none;place-items:center;z-index:90;padding:18px;
}
.modal.on{display:grid}
.modal .card{
  width:min(880px,100%);max-height:86vh;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 30px 70px -30px #000;
}
.modal header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal h3{margin:0;font-size:13.5px;font-weight:650}
.modal .meta{font-size:11px;color:var(--txt-3);font-family:var(--mono)}
.modal pre{
  margin:0;padding:14px;overflow:auto;flex:1;font-family:var(--mono);font-size:11.5px;
  line-height:1.65;color:#bdd0e3;background:#080b10;white-space:pre;max-height:60vh;
}
.modal footer{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line);justify-content:flex-end}
.close{margin-left:auto;border:0;background:transparent;color:var(--txt-3);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.close:hover{color:var(--txt);background:#1b2431}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:#182231;border:1px solid #2b3a4c;color:var(--txt);padding:9px 16px;border-radius:10px;
  font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:120;
  box-shadow:0 16px 40px -18px #000;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(61,220,180,.5)}
.toast.err{border-color:rgba(242,88,122,.5)}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4.2"/>
      </svg>
    </div>
    <div>
      <h1>直播源分组工作台</h1>
      <p>TXT ⇄ M3U · 45 组词库自动归类 · EPG + 台标注入</p>
    </div>
  </div>
  <div class="top-stats">
    <div class="chip">频道 <b id="stTotal">0</b></div>
    <div class="chip">分组 <b id="stGroup">0</b></div>
    <div class="chip warn">未识别 <b id="stUnmatched">0</b></div>
    <div class="chip" id="epgChip">EPG 命中 <b id="stEpg">—</b></div>
  </div>
</header>

<div class="layout">

  <!-- ============ 左侧控制栏 ============ -->
  <aside class="rail panel">

    <section class="blk">
      <h2>1 · 导入源 <span class="tag">txt / m3u</span></h2>
      <div class="drop" id="drop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M12 16V4M12 4l4 4M12 4L8 8"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
        <strong>点击选择文件</strong>
        <span>或拖拽 .txt / .m3u / .m3u8 到此处</span>
      </div>
      <input type="file" id="fileInput" class="sr" multiple accept=".txt,.m3u,.m3u8,text/plain">

      <details class="more">
        <summary>粘贴文本 / 从链接导入</summary>
        <div class="field">
          <textarea id="pasteBox" placeholder="频道名,http://地址&#10;CCTV1|CCTV-1,http://...&#10;或整段 #EXTM3U 内容"></textarea>
        </div>
        <div class="btn-row">
          <button class="btn" id="btnPaste">解析粘贴内容</button>
          <button class="btn ghost" id="btnClearPaste">清空</button>
        </div>
        <div class="field" style="margin-top:10px">
          <label>订阅地址（需目标站允许跨域）</label>
          <input type="text" id="urlInput" placeholder="https://example.com/live.m3u">
        </div>
        <div class="btn-row">
          <button class="btn" id="btnUrl">从链接导入</button>
          <button class="btn ghost" id="btnDemo">载入 demo.txt</button>
        </div>
      </details>
    </section>

    <section class="blk">
      <h2>2 · 电子节目单 EPG</h2>
      <div class="field">
        <label>EPG 地址（写入 M3U 头 + 用于匹配 tvg-id）</label>
        <input type="text" id="epgUrl" value="https://epg.catvod.com/epg.xml">
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnEpg">读取节目单</button>
      </div>
      <div class="status"><span class="dot" id="epgDot"></span><span id="epgText">尚未载入</span></div>

      <details class="more">
        <summary>自动读取失败？这里有两个兜底</summary>
        <div class="field">
          <label>代理前缀（可选，如 https://your-proxy/?url=）</label>
          <input type="text" id="epgProxy" placeholder="https://api.allorigins.win/raw?url=">
        </div>
        <div class="field">
          <label>直接粘贴 epg.xml 内容（最稳）</label>
          <textarea id="epgXml" placeholder="&lt;?xml version=&quot;1.0&quot;?&gt;&lt;tv&gt;&lt;channel id=&quot;cctv1&quot;&gt;..."></textarea>
        </div>
        <button class="btn" id="btnEpgPaste">解析粘贴的 EPG</button>
      </details>
    </section>

    <section class="blk">
      <h2>3 · 导出选项</h2>
      <label class="opt"><input type="checkbox" id="optEpg" checked><span>写入节目单信息<em>M3U 头部 x-tvg-url 与 tvg-id</em></span></label>
      <label class="opt"><input type="checkbox" id="optLogo" checked><span>补全台标 tvg-logo<em>live.fanmingming.com/tv/ 台标库</em></span></label>
      <label class="opt"><input type="checkbox" id="optName" checked><span>写入 tvg-name<em>使用词库标准台名，便于播放器匹配</em></span></label>
      <label class="opt"><input type="checkbox" id="optGroup" checked><span>保留分组信息<em>group-title / #genre# 段落</em></span></label>

      <div class="btn-row" style="margin-top:12px">
        <button class="btn primary" id="expM3u">导出 M3U</button>
        <button class="btn primary" id="expTxt">导出 TXT</button>
      </div>
      <div class="btn-row" style="margin-top:7px">
        <button class="btn ghost" id="expViewM3u">预览 M3U</button>
        <button class="btn ghost" id="expViewTxt">预览 TXT</button>
      </div>
      <p style="font-size:10.8px;color:var(--txt-3);line-height:1.6;margin:9px 0 0">
        导出遵循列表当前的搜索与筛选，无筛选时导出全部。
      </p>
    </section>

    <section class="blk">
      <h2>4 · 维护</h2>
      <div class="btn-row">
        <button class="btn" id="btnRescan">重新分组</button>
        <button class="btn ghost" id="btnClear">清空列表</button>
      </div>
    </section>

  </aside>

  <!-- ============ 右侧结果区 ============ -->
  <main class="stage panel">
    <div class="stage-head">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="q" placeholder="搜索频道名、地址或分组…">
      </div>
      <div class="seg" id="segFilter">
        <button data-f="all" class="on">全部</button>
        <button data-f="matched">已识别</button>
        <button data-f="unmatched">未识别</button>
      </div>
    </div>
    <div class="stage-body" id="stageBody"></div>
  </main>

</div>

<!-- 预览弹层 -->
<div class="modal" id="modal">
  <div class="card">
    <header>
      <h3 id="modalTitle">预览</h3>
      <span class="meta" id="modalMeta"></span>
      <button class="close" id="modalClose" aria-label="关闭">×</button>
    </header>
    <pre id="modalPre"></pre>
    <footer>
      <button class="btn ghost" id="modalCopy">复制全部</button>
      <button class="btn primary" id="modalSave">下载文件</button>
    </footer>
  </div>

<script>/* ===================== 状态 ===================== */

/* ===================== 工具 ===================== */
const $ = (s, r = document) => r.querySelector(s);

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, kind = '') {
  const t = $('#toast');

  toast._t = setTimeout(() => { t.className = 'toast ' + kind; }, 2200);
}

/* 归一化：去符号/空格/全角，小写 */
function norm(s) {
  if (!s) return '';
  let x = String(s).trim().toLowerCase();
  x = x.replace(/[\s\u3000]+/g, '');
  x = x.replace(/[（）()【】\[\]｛｝{}「」《》<>·•・\-_—–~～、,，.。:：;；!！?？'"“”‘’|\/\\+&]/g, '');
  x = x.replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
  return x;
}

/* 严格归一化：只压紧空白与全角，保留 + # 等有效符号 */
function sNorm(s) {
  if (!s) return '';
  let x = String(s).trim().toLowerCase().replace(/[\s\u3000]+/g, '');
  x = x.replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
  return x;
}

/* 去掉清晰度、括号备注等装饰，用于二次匹配 */
const DECOR = [
  /\[[^\]]*\]/g, /（[^）]*）/g, /\([^)]*\)/g,
  /超高清|高清|标清|蓝光|蓝光原盘|4k|8k|uhd|fhd|hd|sd|1080p?|720p?|576p?|2160p?/gi,
  /杜比|hdr|hevc|h\.?265|h\.?264/gi
];
function undecor(s) {
  let x = String(s);
  DECOR.forEach((r) => { x = x.replace(r, ''); });
  x = x.replace(/[\s\u3000]+/g, '');
  return x;
}

/* ===================== 词典索引 ===================== */
const DICT = window.__CHANNEL_DICT__ || { groups: [] };
const aliasIndex = new Map();   // norm(alias) -> {g, canon}
const strictIndex = new Map();  // 保留 +/# 等符号的严格键 -> {g, canon}
const aliasList = [];           // {k, g, canon} 按长度降序
const canonOf = new Map();      // norm(alias) -> canon 显示名

(function buildIndex() {
  for (const grp of DICT.groups) {
    for (const arr of grp.c) {
      const canon = arr[0];
      for (const a of arr) {
        const k = norm(a);
        if (!k) continue;
        const sk = sNorm(a);
        if (sk && !strictIndex.has(sk)) strictIndex.set(sk, { g: grp.g, canon });
        if (!aliasIndex.has(k)) {
          aliasIndex.set(k, { g: grp.g, canon });
          canonOf.set(k, canon);
          aliasList.push({ k, g: grp.g, canon });
        }
      }
    }
  }
  aliasList.sort((a, b) => b.k.length - a.k.length);
})();

/* 关键词兜底规则 */
const RULES = [
  [/cctv-?(\d+)/i, '央视频道'], [/cgtn/i, '央视频道'], [/cetv/i, '央视频道'],
  [/卫视|cetv|教育台/i, '卫视频道'],
  [/英超|西甲|意甲|德甲|nba|足球|篮球|体育|赛事|斯诺克|网球|f1/i, '体育频道'],
  [/卡通|动漫|动画|少儿|kids|anime/i, '动画频道'],
  [/纪录|纪实|discovery|docu/i, '特色频道'],
  [/电影|影院|影迷|cinema|movie|大片/i, '电影频道'],
  [/春晚/i, '春晚频道'],
  [/新闻|news|资讯/i, '特色频道'],
  [/音乐|music|戏曲|综艺|剧场|电视剧/i, '特色频道'],
  [/凤凰|tvb|翡翠|明珠|hoy|viutv|rthk|澳门|澳视|东森|中天|三立|民视|台视|华视|中视|八大|纬来|龙华|靖天/i, '港·澳·台'],
  [/huya|虎牙/i, '虎牙'], [/douyu|斗鱼/i, '斗鱼'], [/^yy|yy\//i, 'YY']
];

function heuristic(name) {
  for (const [re, g] of RULES) if (re.test(name)) return g;
  return OTHER;
}

/**
 * 匹配频道：返回 {group, canon, hit}
 * hit: exact | partial | fuzzy | none
 */
function matchChannel(rawName) {
  const name = String(rawName || '').trim();
  if (!name) return { group: OTHER, canon: name, hit: 'none' };
  const n = norm(name);
  const sn = sNorm(name);
  const nu = norm(undecor(name));
  const su = sNorm(undecor(name));

  // 0. 严格键优先（保留 + 等符号，避免 CCTV5+ 被当成 CCTV5）
  if (strictIndex.has(sn)) {
    const m = strictIndex.get(sn);
    return { group: m.g, canon: m.canon, hit: 'exact' };
  }

  // 1. 精确
  if (aliasIndex.has(n)) {
    const m = aliasIndex.get(n);
    return { group: m.g, canon: m.canon, hit: 'exact' };
  }
  // 2. 去装饰后精确（严格键 → 普通键）
  if (su && su !== sn && strictIndex.has(su)) {
    const m = strictIndex.get(su);
    return { group: m.g, canon: m.canon, hit: 'exact' };
  }
  if (nu && aliasIndex.has(nu)) {
    const m = aliasIndex.get(nu);
    return { group: m.g, canon: m.canon, hit: 'exact' };
  }
  // 3. 去掉尾部 D/B 变体再试
  const v = nu.replace(/[db]$/, '');
  if (v && v !== nu && aliasIndex.has(v)) {
    const m = aliasIndex.get(v);
    return { group: m.g, canon: m.canon, hit: 'exact' };
  }

  // 4. 双向包含（取最长命中，长度>=3 抑制误判）
  const u = nu;
  let best = null;
  for (const a of aliasList) {
    if (a.k.length < 3) continue;
    if (n.includes(a.k) || (u.length >= 3 && u.includes(a.k))) {
      best = a; break;                 // aliasList 已按长度降序
    }
    if (u.length >= 3 && a.k.includes(u) && u.length >= a.k.length - 4) {
      best = a; break;
    }
  }
  if (best) return { group: best.g, canon: best.canon, hit: 'partial' };

  // 5. 关键词
  const g = heuristic(name);
  return { group: g, canon: name, hit: g === OTHER ? 'none' : 'fuzzy' };
}

/* ===================== 解析 ===================== */
function isUrl(s) {
  return /^(https?|rtmp|rtsp|udp|rtp|p3p|p2p|mms|rtmps?|hls|http):\/\//i.test(s) || /^\/\//.test(s);
}

/** 从一行 "名称,url" / "名称|别名,url" / "url" 中拆出 */
function splitLine(line) {
  const t = line.trim();
  if (!t || t.startsWith('#')) return null;
  const idx = t.lastIndexOf(',');
  if (idx > 0) {
    const left = t.slice(0, idx).trim();
    const right = t.slice(idx + 1).trim();
    if (isUrl(right) || right.length > 0) {
      const names = left.split('|').map((x) => x.trim()).filter(Boolean);
      return { name: names[0] || right, url: right };
    }
  }
  if (isUrl(t)) return { name: t.split('/').pop().split('?')[0] || t, url: t };
  return null;
}

function parseTxt(text) {
  const out = [];
  let curGroup = null;
  let loose = [];
  const lines = text.split(/\r?\n/);
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (/,?#genre#/i.test(line)) {
      curGroup = line.replace(/,?#genre#/i, '').replace(/^[,\s]+|[,\s]+$/g, '').trim() || '未命名分组';
      continue;
    }
    const item = splitLine(line);
    if (!item) continue;
    item.srcGroup = curGroup;
    out.push(item);
    if (!curGroup) loose.push(item);
  }
  return out;
}

function parseM3u(text) {
  const out = [];
  let meta = null;
  const lines = text.split(/\r?\n/);
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (/^#EXTINF/i.test(line)) {
      const attr = {};
      const re = /([\w-]+)="([^"]*)"/g;
      let m;
      while ((m = re.exec(line))) attr[m[1].toLowerCase()] = m[2];
      const tail = line.split(',').pop().trim();
      meta = { name: tail || attr['tvg-name'] || '', attr, url: '' };
      continue;
    }
    if (line.startsWith('#EXTGRP:')) {
      if (meta) meta.attr['group-title'] = line.slice(8).trim();
      continue;
    }
    if (line.startsWith('#')) continue;
    if (meta && !meta.url) {
      meta.url = line;
      out.push({
        name: meta.name || meta.attr['tvg-name'] || line,
        url: line,
        srcGroup: meta.attr['group-title'] || null,
        tvgId: meta.attr['tvg-id'] || '',
        tvgName: meta.attr['tvg-name'] || '',
        logo: meta.attr['tvg-logo'] || ''
      });
      meta = null;
      continue;
    }
    const it = splitLine(line);
    if (it) out.push(it);
  }
  return out;
}

function parseAuto(text) {
  const t = text.replace(/^\uFEFF/, '').trim();
  if (/^#EXTM3U/i.test(t) || /#EXTINF/i.test(t)) return { kind: 'm3u', items: parseM3u(t) };
  if (/,?#genre#/i.test(t)) return { kind: 'txt', items: parseTxt(t) };
  const items = parseTxt(t);
  return { kind: 'plain', items };
}

/* ===================== 入库 ===================== */
function addItems(items, opts = {}) {
  const { respectSource = true } = opts;
  let added = 0, dup = 0;
  const seen = new Set(S.entries.map((e) => e.name + '\u0001' + e.url));
  for (const it of items) {
    const url = (it.url || '').trim();
    if (!url) continue;
    let name = (it.name || '').trim() || url;
    name = name.replace(/^["']|["']$/g, '').trim();
    const key = name + '\u0001' + url;
    if (seen.has(key)) { dup++; continue; }
    seen.add(key);

    const m = matchChannel(name);
    const logoName = (m.canon || name).replace(/[\\/:*?"<>|]/g, '');
    S.entries.push({
      name,
      url,
      group: m.group,
      canon: m.canon,
      hit: it.tvgId ? 'm3u' : m.hit,
      tvgId: it.tvgId || '',
      logo: it.logo || '',
      logoName,
      srcGroup: it.srcGroup || null
    });
    added++;
  }
  rebuildGroups();
  return { added, dup };
}

function rebuildGroups() {
  const order = DICT.groups.map((g) => g.g);
  const present = new Set(S.entries.map((e) => e.group));
  const gs = [];
  for (const g of order) if (present.has(g)) gs.push(g);
  for (const g of present) if (!gs.includes(g)) gs.push(g);
  // 其他放最后
  const i = gs.indexOf(OTHER);
  if (i >= 0) { gs.splice(i, 1); gs.push(OTHER); }
  S.groups = gs;
}

function countBy(group) {
  return S.entries.filter((e) => e.group === group).length;
}

/* ===================== EPG ===================== */
function parseEpgXml(text) {
  const map = new Map();
  function scan(src) {
    const re = /<channel\b[^>]*\bid\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/channel>/gi;
    let m, n = 0;
    while ((m = re.exec(src))) {
      const id = m[1].trim();
      if (!id) continue;
      n++;
      const cand = new Set([id]);
      const dre = /<display-name[^>]*>([\s\S]*?)<\/display-name>/gi;
      let d;
      while ((d = dre.exec(m[2]))) {
        const v = d[1].replace(/<!\[CDATA\[|\]\]>/g, '').trim();
        if (v) cand.add(v);
      }
      for (const c of cand) {
        const k = norm(c);
        if (k && !map.has(k)) map.set(k, id);
      }
    }
    return n;
  }

  let count = 0;
  try {
    const doc = new DOMParser().parseFromString(text, 'text/xml');
    const chans = doc.getElementsByTagName('channel');
    if (chans.length) {
      count = chans.length;
      for (const ch of chans) {
        const id = (ch.getAttribute('id') || '').trim();
        if (!id) continue;
        const cand = new Set([id]);
        for (const n of ch.getElementsByTagName('display-name')) {
          const v = n.textContent.trim();
          if (v) cand.add(v);
        }
        for (const c of cand) {
          const k = norm(c);
          if (k && !map.has(k)) map.set(k, id);
        }
      }
    }
  } catch (e) { /* 交给正则兜底 */ }

  if (!count) count = scan(text);
  if (!count) throw new Error('未找到 <channel> 节点');
  return { map, count };
}

async function fetchEpg(url, opts = {}) {
  const { silent = false } = opts;
  setEpgStatus('loading', '正在读取节目单…');
  const tryUrls = [];
  if (opts.proxy) tryUrls.push(opts.proxy + url);
  tryUrls.push(url);
  let lastErr = '';
  for (const u of tryUrls) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 20000);
      const res = await fetch(u, { signal: ctrl.signal, mode: 'cors', credentials: 'omit' });
      clearTimeout(timer);
      if (!res.ok) { lastErr = 'HTTP ' + res.status; continue; }
      const text = await res.text();
      if (!/<channel/i.test(text)) { lastErr = '返回内容不含频道信息'; continue; }
      const parsed = parseEpgXml(text);
      S.epg = { map: parsed.map, loaded: true, count: parsed.count, id: url };
      applyEpg();
      setEpgStatus('on', `已载入 ${parsed.count} 个频道节目单`);
      if (!silent) toast(`节目单已载入：${parsed.count} 个频道`, 'ok');
      render();
      return true;
    } catch (e) {
      lastErr = e.name === 'AbortError' ? '请求超时' : e.message;
    }
  }
  setEpgStatus('off', `自动读取失败（${lastErr || '网络/CORS 限制'}），可点“粘贴 XML”手动导入`);
  render();
  return false;
}

function setEpgStatus(state, msg) {
  const box = $('#epgStatus');
  if (!box) return;
  const dot = $('#epgDot');
  dot.className = 'dot ' + ({ on: 'on', loading: 'on', off: 'off', err: 'err' }[state] || '');
  $('#epgText').textContent = msg;
  S.log.push(msg);
}

function applyEpg() {
  if (!S.epg.loaded) return;
  const m = S.epg.map;
  let hit = 0;
  for (const e of S.entries) {
    const keys = [e.canon, e.name, undecor(e.name), undecor(e.canon)];
    let id = '';
    for (const k of keys) {
      const nk = norm(k);
      if (nk && m.has(nk)) { id = m.get(nk); break; }
    }
    if (!id) {
      for (const k of keys) {
        const nk = norm(k);
        if (nk.length < 3) continue;
        for (const [mk, mid] of m) {
          if (mk.length >= 3 && (mk === nk || mk.includes(nk) || nk.includes(mk))) { id = mid; break; }
        }
        if (id) break;
      }
    }
    e.tvgId = id || '';
    if (id) hit++;
  }
  S.epg.matched = hit;
}

/* ===================== 渲染 ===================== */
function visibleEntries() {
  const q = S.q.trim().toLowerCase();
  return S.entries.filter((e) => {
    if (S.filter === 'unmatched' && e.hit !== 'none') return false;
    if (S.filter === 'matched' && e.hit === 'none') return false;
    if (!q) return true;
    return e.name.toLowerCase().includes(q) || e.url.toLowerCase().includes(q) || (e.group || '').toLowerCase().includes(q);
  });
}

function render() {
  const total = S.entries.length;
  const unmatched = S.entries.filter((e) => e.hit === 'none').length;
  $('#stTotal').textContent = total;
  $('#stGroup').textContent = S.groups.length;
  $('#stUnmatched').textContent = unmatched;
  $('#stEpg').textContent = S.epg.loaded ? (S.epg.matched || 0) : '—';
  $('#epgChip').className = 'chip ' + (S.epg.loaded ? 'ok' : (total ? 'warn' : ''));

  const body = $('#stageBody');
  const list = visibleEntries();

  if (!total) {
    body.innerHTML = `<div class="empty">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h10M4 18h7"/></svg></div>
      <h3>还没有导入任何频道</h3>
      <p>在左侧粘贴直播源文本，导入 <code>.txt</code> / <code>.m3u</code> 文件，或直接填入订阅链接。系统会按内置的 45 个分组词库自动归类，未识别的进入「其他」。</p>
    </div>`;
    return;
  }
  if (!list.length) {
    body.innerHTML = `<div class="empty"><h3>没有符合条件的频道</h3><p>换个关键词或把筛选切回“全部”。</p></div>`;
    return;
  }

  const byGroup = new Map();
  for (const e of list) {
    if (!byGroup.has(e.group)) byGroup.set(e.group, []);
    byGroup.get(e.group).push(e);
  }
  const frag = document.createDocumentFragment();
  let gi = 0;
  for (const g of S.groups) {
    const arr = byGroup.get(g);
    if (!arr || !arr.length) continue;
    gi++;
    const closed = gi > 2 && !S.q;
    frag.appendChild(groupEl(g, arr, closed));
  }
  body.innerHTML = '';
  body.appendChild(frag);
}

function groupEl(name, arr, closed) {
  const wrap = document.createElement('div');
  wrap.className = 'grp' + (closed ? ' closed' : '');
  wrap.dataset.group = name;

  const matched = arr.filter((e) => e.hit !== 'none').length;
  const pct = Math.round((matched / arr.length) * 100);
  const h = document.createElement('div');
  h.className = 'grp-h';
  h.innerHTML = `<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>
    <b>${esc(name)}</b><span class="n">${arr.length}</span>
    <span class="bar"><i style="width:${pct}%"></i></span>`;
  h.addEventListener('click', () => {
    wrap.classList.toggle('closed');
    if (!wrap.classList.contains('closed') && !wrap.dataset.filled) fillGroup(wrap, name);
  });
  wrap.appendChild(h);

  const b = document.createElement('div');
  b.className = 'grp-body';
  wrap.appendChild(b);
  if (!closed) fillGroup(wrap, name);
  return wrap;
}

function fillGroup(wrap, group) {
  const body = wrap.querySelector('.grp-body');
  const list = visibleEntries().filter((e) => e.group === group);
  const frag = document.createDocumentFragment();
  list.forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    const badgeTxt = { exact: '精确', partial: '包含', fuzzy: '关键词', m3u: '源内', none: '未识别' }[e.hit] || '';
    const logoUrl = e.logo || (S.useLogo ? LOGO_BASE + encodeURIComponent(e.logoName) + '.png' : '');
    row.innerHTML = `
      <span class="idx">${i + 1}</span>
      <span class="nm" title="${esc(e.name)}">
        ${logoUrl ? `<img class="logo" src="${esc(logoUrl)}" alt="" loading="lazy" data-fb="0">` : ''}
        <span style="overflow:hidden;text-overflow:ellipsis">${esc(e.name)}</span>
        <span class="badge ${e.hit}">${badgeTxt}</span>
      </span>
      <span class="url" title="${esc(e.url)}">${esc(e.url)}</span>
      <select data-idx="${idxOf(e)}" class="gs">
        ${S.groups.map((g) => `<option ${g === e.group ? 'selected' : ''}>${esc(g)}</option>`).join('')}
      </select>
      <button class="act" title="删除">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>`;
    const img = row.querySelector('img.logo');
    if (img) {
      img.addEventListener('error', () => {
        const step = Number(img.dataset.fb || 0);
        const alts = logoAlts(e);
        if (step < alts.length) {
          img.dataset.fb = step + 1;
          img.src = alts[step];
        } else {
          img.remove();
        }
      });
    }
    row.querySelector('.gs').addEventListener('change', (ev) => {
      const t = S.entries[Number(ev.target.dataset.idx)];
      t.group = ev.target.value;
      t.hit = t.hit === 'none' ? 'exact' : t.hit;
      rebuildGroups();
      render();
      toast(`已移动到「${ev.target.value}」`);
    });
    row.querySelector('.act').addEventListener('click', () => {
      const idx = Number(row.querySelector('select').dataset.idx);
      S.entries.splice(idx, 1);
      rebuildGroups();
      render();
    });
    frag.appendChild(row);
  });
  body.innerHTML = '';
  body.appendChild(frag);
  wrap.dataset.filled = '1';
}

function idxOf(e) { return S.entries.indexOf(e); }

function logoAlts(e) {
  const base = e.logoName || e.name;
  const plain = base.replace(/[（(].*?[)）]/g, '').replace(/(高清|超清|标清|蓝光|HD|FHD|4K|8K)/gi, '').trim() || base;
  const out = [];
  const cands = [plain, e.canon, base, plain.replace(/\s+/g, '')];
  for (const c of cands) {
    if (!c) continue;
    const u = LOGO_BASE + encodeURIComponent(c) + '.png';
    if (!out.includes(u)) out.push(u);
  }
  return out;
}

/* ===================== 导出 ===================== */
function exportList() {
  const list = visibleEntries();
  return list.length ? list : S.entries;
}

function buildM3u(list, o) {
  const head = o.epg ? `#EXTM3U x-tvg-url="${o.epgUrl}" url-tvg="${o.epgUrl}"` : '#EXTM3U';
  const out = [head];
  for (const e of list) {
    const attrs = [];
    const id = o.epg ? (e.tvgId || '') : '';
    if (id) attrs.push(`tvg-id="${id}"`);
    if (o.tvgName) attrs.push(`tvg-name="${e.canon || e.name}"`);
    const logo = o.logo ? (e.logo || LOGO_BASE + encodeURIComponent(e.logoName || e.name) + '.png') : '';
    if (logo) attrs.push(`tvg-logo="${logo}"`);
    if (o.group) attrs.push(`group-title="${e.group}"`);
    out.push(`#EXTINF:-1 ${attrs.join(' ')},${e.name}`.replace(/\s+,/, ','));
    out.push(e.url);
  }
  return out.join('\n') + '\n';
}

function buildTxt(list, o) {
  const byGroup = new Map();
  for (const e of list) {
    if (!byGroup.has(e.group)) byGroup.set(e.group, []);
    byGroup.get(e.group).push(e);
  }
  const out = [];
  const names = o.group ? S.groups.filter((g) => byGroup.has(g)) : [''];
  for (const g of names) {
    const arr = byGroup.get(g) || [];
    if (!arr.length) continue;
    if (g) out.push(`${g},#genre#`);
    for (const e of arr) out.push(`${e.name},${e.url}`);
    out.push('');
  }
  return out.join('\n').trim() + '\n';
}

function download(filename, text, mime = 'text/plain;charset=utf-8') {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function stamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}

function curOptions() {
  return {
    epg: $('#optEpg').checked,
    epgUrl: ($('#epgUrl').value || DEFAULT_EPG).trim(),
    logo: $('#optLogo').checked,
    tvgName: $('#optName').checked,
    group: $('#optGroup').checked
  };
}

function showPreview(kind) {
  const list = exportList();
  const o = curOptions();
  const text = kind === 'm3u' ? buildM3u(list, o) : buildTxt(list, o);
  $('#modalTitle').textContent = kind === 'm3u' ? 'M3U 预览' : 'TXT 预览';
  $('#modalMeta').textContent = `${list.length} 条 · ${(new Blob([text]).size / 1024).toFixed(1)} KB`;
  $('#modalPre').textContent = text.length > 60000 ? text.slice(0, 60000) + '\n…（预览截断，导出为完整内容）' : text;
  $('#modal').classList.add('on');
  $('#modal').dataset.kind = kind;
}

/* ===================== 事件绑定 ===================== */
function readFile(file) {
  const fr = new FileReader();
  fr.onload = () => importText(String(fr.result), file.name);
  fr.readAsText(file, 'utf-8');
}

function importText(text, label = '文本') {
  const { kind, items } = parseAuto(text);
  if (!items.length) {
    toast('没有解析到有效频道，检查是否为「频道名,地址」格式', 'err');
    return;
  }
  const { added, dup } = addItems(items);
  if (S.epg.loaded) applyEpg();
  render();
  toast(`${label}：解析 ${items.length} 条，新增 ${added} 条${dup ? `，跳过重复 ${dup}` : ''}`, 'ok');
}

function bind() {
  const dz = $('#drop');
  const fi = $('#fileInput');
  dz.addEventListener('click', () => fi.click());
  fi.addEventListener('change', () => {
    [...fi.files].forEach(readFile);
    fi.value = '';
  });
  ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files && files.length) [...files].forEach(readFile);
    else {
      const t = e.dataTransfer.getData('text');
      if (t) importText(t, '拖入文本');
    }
  });

  $('#btnPaste').addEventListener('click', () => {
    const t = $('#pasteBox').value;
    if (!t.trim()) { toast('先粘贴内容再解析', 'err'); return; }
    importText(t, '粘贴文本');
  });
  $('#btnClearPaste').addEventListener('click', () => { $('#pasteBox').value = ''; });

  $('#btnUrl').addEventListener('click', async () => {
    const u = $('#urlInput').value.trim();
    if (!u) { toast('请填写订阅地址', 'err'); return; }
    const btn = $('#btnUrl');
    btn.disabled = true; btn.textContent = '拉取中…';
    try {
      const res = await fetch(u, { mode: 'cors' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const t = await res.text();
      importText(t, '订阅源');
    } catch (e) {
      toast(`拉取失败：${e.message}（多为跨域限制，请直接下载文件再导入）`, 'err');
    } finally {
      btn.disabled = false; btn.textContent = '从链接导入';
    }
  });

  $('#btnDemo').addEventListener('click', async () => {
    try {
      const res = await fetch('demo.txt');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      importText(await res.text(), '示例 demo.txt');
    } catch (e) {
      toast('示例文件不在同目录，可直接把 demo.txt 拖进来', 'err');
    }
  });

  $('#btnEpg').addEventListener('click', () => {
    fetchEpg(($('#epgUrl').value || DEFAULT_EPG).trim(), { proxy: ($('#epgProxy').value || '').trim() });
  });

  $('#btnEpgPaste').addEventListener('click', () => {
    const xml = $('#epgXml').value.trim();
    if (!xml) { toast('先粘贴 EPG XML 内容', 'err'); return; }
    try {
      const p = parseEpgXml(xml);
      S.epg = { map: p.map, loaded: true, count: p.count, id: '手动导入' };
      applyEpg();
      setEpgStatus('on', `已载入 ${p.count} 个频道节目单（手动）`);
      render();
      toast(`节目单已载入：${p.count} 个频道`, 'ok');
    } catch (e) {
      setEpgStatus('err', '解析失败：' + e.message);
      toast('XML 解析失败', 'err');
    }
  });

  $('#q').addEventListener('input', (e) => { S.q = e.target.value; render(); });
  $$('#segFilter button').forEach((b) => b.addEventListener('click', () => {
    $$('#segFilter button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    S.filter = b.dataset.f;
    render();
  }));

  $('#optLogo').addEventListener('change', (e) => { S.useLogo = e.target.checked; render(); });

  $('#expM3u').addEventListener('click', () => {
    if (!S.entries.length) return toast('没有可导出的频道', 'err');
    download(`live-${stamp()}.m3u`, buildM3u(exportList(), curOptions()), 'audio/x-mpegurl');
    toast('已导出 M3U', 'ok');
  });
  $('#expTxt').addEventListener('click', () => {
    if (!S.entries.length) return toast('没有可导出的频道', 'err');
    download(`live-${stamp()}.txt`, buildTxt(exportList(), curOptions()));
    toast('已导出 TXT', 'ok');
  });
  $('#expViewM3u').addEventListener('click', () => showPreview('m3u'));
  $('#expViewTxt').addEventListener('click', () => showPreview('txt'));

  $('#modalClose').addEventListener('click', () => $('#modal').classList.remove('on'));
  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') $('#modal').classList.remove('on'); });
  $('#modalSave').addEventListener('click', () => {
    const kind = $('#modal').dataset.kind || 'm3u';
    const list = exportList();
    const text = kind === 'm3u' ? buildM3u(list, curOptions()) : buildTxt(list, curOptions());
    download(`live-${stamp()}.${kind}`, text, kind === 'm3u' ? 'audio/x-mpegurl' : 'text/plain;charset=utf-8');
    toast('已导出', 'ok');
  });
  $('#modalCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('#modalPre').textContent); toast('已复制到剪贴板', 'ok'); }
    catch { toast('复制失败，请手动选择文本', 'err'); }
  });

  $('#btnClear').addEventListener('click', () => {
    if (!S.entries.length) return;
    if (!confirm(`确定清空 ${S.entries.length} 条频道？`)) return;
    S.entries = []; S.groups = []; render(); toast('已清空');
  });

  $('#btnRescan').addEventListener('click', () => {
    if (!S.entries.length) return toast('先导入频道');
    for (const e of S.entries) {
      const m = matchChannel(e.name);
      e.group = m.group; e.canon = m.canon;
      e.hit = e.tvgId ? 'm3u' : m.hit;
    }
    rebuildGroups();
    if (S.epg.loaded) applyEpg();
    render();
    toast('已按当前词库重新分组', 'ok');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') $('#modal').classList.remove('on');
  });
}

/* ===================== 启动 ===================== */
S.useLogo = true;
document.addEventListener('DOMContentLoaded', () => {
  bind();
  render();
  setEpgStatus('off', '尚未载入节目单 · 点击下方按钮从 ' + DEFAULT_EPG + ' 读取');
});
</script>
</body>
</html>
